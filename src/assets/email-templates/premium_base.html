<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #020617;
            color: #cbd5e1;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #020617;
            padding: 40px 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #0f172a;
            border-radius: 24px;
            border: 1px solid #1e293b;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            padding: 48px 40px 32px;
            text-align: center;
            background: linear-gradient(180deg, rgba(20, 184, 166, 0.05) 0%, rgba(15, 23, 42, 0) 100%);
        }

        .logo {
            width: 56px;
            height: 56px;
            margin-bottom: 24px;
        }

        .content {
            padding: 0 40px 48px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 16px;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #94a3b8;
            margin: 0 0 24px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid #334155;
        }

        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(20, 184, 166, 0.3);
            transition: transform 0.2s;
        }

        .footer {
            padding: 32px 40px;
            background-color: #020617;
            text-align: center;
            border-top: 1px solid #1e293b;
        }

        .footer p {
            font-size: 12px;
            color: #475569;
            margin: 0;
            line-height: 1.5;
        }

        .accent-text {
            color: #14b8a6;
            font-weight: 600;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #1e293b, transparent);
            margin: 32px 0;
        }

        .social-link {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 8px;
        }

        @media only screen and (max-width: 600px) {
            .wrapper { padding: 20px 0; }
            .container { border-radius: 16px; margin: 0 16px; }
            .header { padding: 32px 24px 24px; }
            .content { padding: 0 24px 32px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <img src="https://alphaclonesystems.com/email-assets/alphaclone-email-logo.png" alt="AlphaClone" class="logo">
                <h1>{{title}}</h1>
            </div>
            <div class="content">
                {{content}}
                
                {{#buttonUrl}}
                <div style="text-align: center; margin-top: 32px;">
                    <a href="{{buttonUrl}}" class="btn">{{buttonText}}</a>
                </div>
                {{/buttonUrl}}

                <div class="divider"></div>
                
                <p style="font-size: 14px; text-align: center;">
                    Questions? Securely contact our ops team at<br>
                    <a href="mailto:ops@alphaclonesystems.com" style="color: #14b8a6; text-decoration: none;">ops@alphaclonesystems.com</a>
                </p>
            </div>
            <div class="footer">
                <p>&copy; 2026 AlphaClone Systems. Proprietary & Confidential.</p>
                <p style="margin-top: 8px;">123 Innovation Drive, Tech City, TC 10101</p>
                <p style="margin-top: 16px;">
                    <a href="https://alphaclonesystems.com/legal" style="color: #64748b; text-decoration: none;">Terms</a> &bull; 
                    <a href="https://alphaclonesystems.com/legal" style="color: #64748b; text-decoration: none;">Privacy</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
