[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Always strip a stale root app/ before Next build. The workflow package can leave
# app/.well-known/workflow in cached layers; when both app/ and src/app exist,
# webpack fails to resolve @/* (Module not found for @/lib/*, @/config/*, etc.).
# railway.toml buildCommand overrides nixpacks.toml [phases.build], so cleanup
# must live here (and in the npm "build" script) — not only in nixpacks.toml.
buildCommand = "rm -rf app && NODE_OPTIONS='--max-old-space-size=12288' npm run build"

[deploy]
# Start Next directly so missing optional env (Redis/Turnstile/etc.) cannot
# prevent the process from listening — that was failing Railway healthchecks.
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
