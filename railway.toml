[build]
builder = "NIXPACKS"
buildCommand = "rm -rf app/ && (rm -rf .next/cache/* 2>/dev/null || true) && npm run build"

[deploy]
startCommand = "npm run start"
# Use liveness (/api/health), not readiness: missing CRON_SECRET/ENCRYPTION_SECRET
# must not block Railway rollouts. Probe /api/readiness separately for config depth.
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
