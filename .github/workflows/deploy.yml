name: Railway Production Health Check

# Railway auto-deploys from GitHub. This workflow does NOT deploy anywhere —
# it verifies alphaclonesystems.com after pushes to main/master.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  health-check:
    name: Post-push production health
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Wait for Railway deploy
        run: sleep 45

      - name: Check production health
        run: |
          url="https://alphaclonesystems.com"
          echo "Checking $url"

          status=$(curl -o /dev/null -s -w "%{http_code}\n" "$url")
          if [ "$status" -ne 200 ]; then
            echo "Main page returned HTTP $status"
            exit 1
          fi
          echo "Main page OK (HTTP $status)"

          api_status=$(curl -o /dev/null -s -w "%{http_code}\n" "$url/api/health" || echo "000")
          if [ "$api_status" -ne 200 ]; then
            echo "API health returned HTTP $api_status"
            exit 1
          fi
          echo "API health OK (HTTP $api_status)"
