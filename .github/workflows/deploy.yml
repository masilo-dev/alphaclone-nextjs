name: Railway Production Health Check

# Railway auto-deploys from GitHub. This workflow does NOT deploy anywhere —
# it verifies alphaclonesystems.com after pushes to main/master.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  health-check:
    name: Post-push production health
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Wait for Railway deployment and check readiness
        run: |
          url="https://alphaclonesystems.com"
          deadline=$((SECONDS + 900))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            root_status=$(curl --connect-timeout 10 --max-time 20 -o /dev/null -s -w "%{http_code}" "$url" || true)
            ready_status=$(curl --connect-timeout 10 --max-time 20 -o /dev/null -s -w "%{http_code}" "$url/api/readiness" || true)
            echo "Attempt $attempt: root=$root_status readiness=$ready_status"
            if [ "$root_status" = "200" ] && [ "$ready_status" = "200" ]; then
              echo "Production page and readiness endpoint are healthy."
              exit 0
            fi
            sleep 15
          done
          echo "Production did not become ready within 15 minutes."
          exit 1
