name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ============================================================================
  # Quality Checks - Linting, Type Checking, Security
  # ============================================================================
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check with TypeScript
        run: npx tsc --noEmit

      - name: Check code formatting (scoped)
        run: npx prettier --check "tests/**/*.{mjs,js,ts}" "docs/**/*.md" ".github/**/*.yml" "scripts/**/*.{mjs,js}"

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Check for known vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ============================================================================
  # Build Verification
  # ============================================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [quality]

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Check build artifacts
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful - .next directory created"
            ls -la .next
          else
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi

  # ============================================================================
  # Database Migration Validation
  # ============================================================================
  migrations:
    name: Validate Database Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check migration files syntax
        run: |
          echo "Checking SQL migration files..."
          if [ ! -d "supabase/migrations" ]; then
            echo "Error: supabase/migrations not found"
            exit 1
          fi
          find supabase/migrations -name "*.sql" -type f | while read file; do
            echo "Validating: $file"
            if grep -q "DROP TABLE IF EXISTS.*CASCADE" "$file" && ! grep -q "CREATE TABLE IF NOT EXISTS" "$file"; then
              echo "Warning: DROP without corresponding CREATE in $file"
            fi
          done

      - name: Check for migration conflicts
        run: |
          echo "Checking for duplicate 14-digit migration timestamps (YYYYMMDDhhmmss)..."
          duplicates=$(for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            prefix="${base%%_*}"
            if [[ "$prefix" =~ ^[0-9]{14}$ ]]; then echo "$prefix"; fi
          done | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "❌ Error: Duplicate migration timestamps found:"
            echo "$duplicates"
            exit 1
          else
            echo "✅ No duplicate 14-digit migration timestamps"
          fi

  # ============================================================================
  # Test Suite (when tests are available)
  # ============================================================================
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test --if-present

      - name: Validate MCP execution layer
        run: npm run validate:mcp-execution

      - name: Run E2E tests
        run: npm run test:e2e --if-present
        env:
          BASE_URL: http://localhost:3000
        continue-on-error: true

  # ============================================================================
  # Platform pentest smoke (requires running server)
  # ============================================================================
  pentest:
    name: Platform Pentest Smoke
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start server and run pentest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          npm run pentest http://localhost:3000 || PENTEST_EXIT=$?
          kill $SERVER_PID || true
          exit ${PENTEST_EXIT:-0}

  # ============================================================================
  # Final Status Check
  # ============================================================================
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [quality, security, build, migrations, test, pentest]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "Quality:    ${{ needs.quality.result }}"
          echo "Security:   ${{ needs.security.result }}"
          echo "Build:      ${{ needs.build.result }}"
          echo "Migrations: ${{ needs.migrations.result }}"
          echo "Tests:      ${{ needs.test.result }}"
          echo "Pentest:    ${{ needs.pentest.result }}"

          failed=0
          if [[ "${{ needs.quality.result }}" == "failure" ]]; then
            echo "FAILED: quality (lint / typecheck / format)"
            failed=1
          fi
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "FAILED: build"
            failed=1
          fi
          if [[ "${{ needs.migrations.result }}" == "failure" ]]; then
            echo "FAILED: migrations"
            failed=1
          fi
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "FAILED: tests"
            failed=1
          fi
          if [[ "${{ needs.pentest.result }}" == "failure" ]]; then
            echo "FAILED: pentest"
            failed=1
          fi
          if [[ "$failed" == "1" ]]; then
            exit 1
          fi
          echo "CI pipeline passed"
